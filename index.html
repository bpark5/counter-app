<!doctype html>
<html lang="en">

<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Demonstration for counter-app">

  <style>
    :root, html, body {
      margin: var(--ddd-spacing-0);
      padding: var(--ddd-spacing-0);
    }
    #demo {
      margin: var(--ddd-spacing-2);
    }
    counter-app {
      margin: var(--ddd-spacing-2);
      border: var(--ddd-border-md);
      border-radius: var(--ddd-radius-lg);
    }
    counter-app:hover {
      box-shadow: var(--ddd-boxShadow-sm);
    }
    #example {
      --counter-app-font-size: var(--ddd-font-size-l);
      background-color: var(--ddd-accent-2);
      color: var(--ddd-primary-17);
    }
  </style>
  <title>counter-app</title>
</head>

<body>
  <div id="demo">
    <!-- <counter-app count="starting point" min = "min value" max = "max value"></counter-app> -->
    <h1>counter-app</h1>
    <!-- this is going to do whatever the tag's defaults are -->
    <h2>Default</h2>
    <counter-app></counter-app>
    <h2>Slot usage</h2>
    <counter-app data-accent="2" data-primary="17" count = "15" min="10" max="20"><div><p>Minimum = 10</p> <p>Maximum = 20</p></div></counter-app>
    <h2>Property usage</h2>
    <counter-app id="example"></counter-app>
    <h2>Extra examples</h2>
    <counter-app count="5" min="-3" max="22"></counter-app>
    <counter-app count="17" min="5" max="34"></counter-app>
  </div>
  <script type="module" src="./counter-app.js"></script>
</body>
</html>
